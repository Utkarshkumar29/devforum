version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/my-app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/microservices-backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
